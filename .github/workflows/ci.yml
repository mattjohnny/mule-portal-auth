# Continuous integration for mule-portal-auth.
#
# Every step here was run locally against this repo before being added. A check that
# is red on arrival gets ignored and then merged past, which is worse than having no
# check - so this file contains only steps that were seen to pass.
#
# Render deploys on push to main, so a green run here is what makes that deploy safe.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede an in-flight run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Fail on stale committed dist
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            git status --short --untracked-files=all -- dist
            exit 1
          fi

  # Separate job so a newly-published advisory cannot mask a real test failure.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
